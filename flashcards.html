<!doctype html>
<html lang="en-AU" data-root="" data-page="cards">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2B33">
<title>Flashcards · Second Pass</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/katex/katex.min.css">
<style>
/* Layout: one big card at a time, tap to flip, four rating buttons sized for thumbs. */
.deckrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.deckrow select{flex:1 1 260px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.card{position:relative;min-height:300px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:26px 24px 22px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:14px;user-select:none;-webkit-user-select:none}
.card .tag{position:absolute;top:12px;left:16px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.card .side{position:absolute;top:12px;right:16px;font-family:var(--mono);font-size:12px;color:var(--ochre)}
.card .front{font-family:var(--display);font-size:clamp(20px,3.4vw,27px);line-height:1.3;text-wrap:balance}
.card .back{border-top:1px dashed var(--rule);padding-top:14px;font-size:18px}
.card .back .eq{overflow-x:auto;padding:4px 0;font-size:20px}
.hint{font-family:var(--mono);font-size:12.5px;color:var(--mute);text-align:center;margin-top:10px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.rate button{font:500 16px var(--display);border-radius:12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:12px 6px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button small{font-family:var(--mono);font-size:11px;color:var(--mute)}
.rate .again{border-color:var(--red)} .rate .easy{border-color:var(--teal)}
.empty{text-align:center;padding:40px 10px}
.empty b{font-family:var(--display);font-size:24px;display:block;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap" style="max-width:760px">
  <div class="kicker">Spaced repetition</div>
  <h1>Flashcards</h1>
  <div class="deckrow"><label for="deck" class="mono">Deck</label><select id="deck"></select></div>
  <div class="stats" id="stats"></div>
  <div id="area"></div>
  <p class="hint" id="kbd">Tap the card to reveal the answer, then rate how well you knew it. Keyboard: space to flip, 1–4 to rate.</p>
</div>
<script src="assets/data.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get("c")) document.documentElement.dataset.course = Q.get("c");
if (Q.get("m")) document.documentElement.dataset.course = Q.get("m") === "2.3P" ? 23 : Q.get("m").split(".")[0];
</script>
<script src="assets/sp.js"></script>
<script src="assets/katex/katex.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const NEW_PER_SESSION = 20;
const sel = $("deck");
const opts = [["today", "Today's review: due cards from modules you've ticked or started"]];
SP.courses.forEach(c => { opts.push(["c" + c.n, "Course " + c.n + " · " + c.name + " (all modules)"]); c.mods.forEach(m => opts.push(["m" + m.id, "   " + m.id + " " + m.title])); });
opts.push(["m2.3P", "Pilot module 2.3 · Rearranging formulas"]);
sel.innerHTML = opts.map(([v, t]) => `<option value="${v}">${t.replace(/ /g, "&nbsp;")}</option>`).join("");
sel.value = Q.get("m") ? "m" + Q.get("m") : Q.get("c") ? "c" + Q.get("c") : "today";
let queue = [], cur = null, flipped = false, seenNew = 0;

function filter(){ const v = sel.value; return v === "today" ? null : v[0] === "c" ? { c:+v.slice(1) } : { m:v.slice(1) }; }
function build(){
  const f = filter(), s = SPX.srs(), now = Date.now();
  let pool = f ? SPX.cardsFor(f) : SPX.todayDeck();
  const due = pool.filter(c => s[c.id] && s[c.id].due <= now), fresh = pool.filter(c => !s[c.id]);
  queue = due.concat(fresh.slice(0, Math.max(0, NEW_PER_SESSION - seenNew)));
  stats(); next();
}
function stats(){
  const f = filter(), di = SPX.dueInfo(f ? SPX.cardsFor(f) : SPX.cardsFor()), today = SPX.todayDeck().length;
  $("stats").innerHTML = `<span class="pill due">${queue.length} in this session</span><span class="pill">${di.due} due</span><span class="pill">${di.fresh} new</span><span class="pill ok">${di.learnt} of ${di.total} learnt</span>` + (f ? `<span class="pill">today's review: ${today}</span>` : "");
}
function tex(el, src){ try { katex.render(src, el, { displayMode:true, throwOnError:false }); } catch(e){ el.textContent = src; } }
function next(){
  flipped = false; cur = queue.shift();
  if (!cur){
    const today = sel.value === "today";
    $("area").innerHTML = `<div class="sheet empty"><b>${today && !Object.keys(SPX.ticks()).length ? "Tick a module to start" : "All done for now"}</b>${today && !Object.keys(SPX.ticks()).length
      ? "Today's review draws on modules you have ticked on a course page. Or choose a course or module deck above to begin."
      : "Nothing more is due in this deck. Cards come back on a schedule: tomorrow, in a few days, then weeks apart."}<div class="row" style="justify-content:center;margin-top:16px"><a class="btn ghost" href="index.html">Home</a></div></div>`;
    $("kbd").hidden = true; return;
  }
  $("kbd").hidden = false;
  const st = SPX.srs()[cur.id], label = st ? "review" : "new";
  $("area").innerHTML = `<div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard. Tap to reveal the answer."><span class="tag">${cur.m === "2.3P" ? "Module 2.3 pilot" : "Module " + cur.m} · ${cur.k}</span><span class="side">${label}</span>
    <div class="front" id="front"></div><div class="back" id="back" hidden></div></div><div class="rate" id="rate" hidden>
    <button class="again" data-r="0">Again<small>a minute</small></button><button data-r="1">Hard<small>${st && st.b > 1 ? "soon" : "tomorrow"}</small></button><button data-r="2">Good<small>${["1 day", "3 days", "a week", "2 weeks", "5 weeks", "3 months", "3 months"][Math.min(6, (st ? st.b : 0))]}</small></button><button class="easy" data-r="3">Easy<small>longer</small></button></div>`;
  $("front").textContent = cur.f;
  if (cur.ft){ const e = document.createElement("div"); e.className = "eq"; e.style.fontSize = "20px"; tex(e, cur.ft); $("front").appendChild(e); }
  const back = $("back");
  if (cur.tex){ const e = document.createElement("div"); e.className = "eq"; tex(e, cur.tex); back.appendChild(e); }
  if (cur.b){ const p = document.createElement("div"); p.textContent = cur.b; back.appendChild(p); }
  $("card").onclick = flip; $("card").onkeydown = e => { if (e.key === "Enter") flip(); };
  $("rate").onclick = e => { const b = e.target.closest("[data-r]"); if (b) rate(+b.dataset.r); };
}
function flip(){ if (!cur || flipped) return; flipped = true; $("back").hidden = false; $("rate").hidden = false; $("card").setAttribute("aria-label", "Answer shown. Rate how well you knew it."); }
function rate(r){ if (!cur || !flipped) return; const wasNew = !SPX.srs()[cur.id]; SPX.rate(cur.id, r); if (wasNew) seenNew++; if (r === 0) queue.splice(Math.min(queue.length, 3), 0, cur); stats(); next(); }
document.addEventListener("keydown", e => { if (e.target.tagName === "SELECT") return; if (e.key === " "){ e.preventDefault(); flip(); } if (flipped && "1234".includes(e.key)) rate(+e.key - 1); });
sel.onchange = () => { seenNew = 0; history.replaceState(null, "", "?" + (sel.value === "today" ? "" : sel.value[0] + "=" + sel.value.slice(1))); build(); };
build();
</script>
</body>
</html>
