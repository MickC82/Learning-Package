<!doctype html>
<html lang="en-AU" data-root="" data-page="viewer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2B33">
<title>Document · Second Pass</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
/* Layout: an in-app document reader. The app bar stays on top; a slim tool row below; pages stack and scroll. */
body{background:#525A5F}
@media (prefers-color-scheme: dark){body{background:#0B0F12}}
.tools{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule)}
.tools .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-left,0px))}
.tools b{font-family:var(--display);font-size:16px;flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools .btn{min-height:40px;padding:7px 12px;font-size:14px}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 8px 90px}
.pg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);position:relative;max-width:100%}
.pg canvas{display:block;width:100%;height:100%}
.pg .no{position:absolute;right:8px;bottom:6px;font:12px var(--mono);color:#8a9399}
#msg{color:#fff;text-align:center;padding:40px 16px;font-family:var(--display)}
</style>
</head>
<body>
<div class="tools"><div class="in">
  <b id="ttl">Loading…</b>
  <span class="mono" id="pinfo" style="color:var(--mute)"></span>
  <button class="btn ghost" id="zo" aria-label="Zoom out">−</button>
  <button class="btn ghost" id="zi" aria-label="Zoom in">+</button>
  <button class="btn ghost" id="top">Top</button>
  <a class="btn ghost" id="dl" download>Save PDF</a>
</div></div>
<div id="msg"></div>
<div id="pages"></div>
<script src="assets/data.js"></script>
<script>
const qs = new URLSearchParams(location.search), FILE = qs.get("f"), TITLE = qs.get("t") || "Document", CN = qs.get("c");
if (CN) document.documentElement.dataset.course = CN;
</script>
<script src="assets/sp.js"></script>
<script type="module">
import * as pdfjsLib from "./assets/pdfjs/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "./assets/pdfjs/pdf.worker.min.mjs";
const $ = id => document.getElementById(id);
const C = CN ? (CN === "23" ? SP.pilot : SP.courses.find(c => String(c.n) === CN)) : null;
$("ttl").textContent = (C ? (CN === "23" ? "Module 2.3" : "Course " + CN) + " · " : "") + TITLE;
document.title = TITLE + " · Second Pass";
$("dl").href = FILE; $("dl").setAttribute("download", FILE.split("/").pop());
let doc = null, zoom = 1, pages = [];
const box = $("pages");
function baseWidth(){ return Math.min(980, box.clientWidth - 16); }
async function layout(){
  box.innerHTML = ""; pages = [];
  for (let i = 1; i <= doc.numPages; i++){
    const pg = await doc.getPage(i), vp = pg.getViewport({ scale:1 });
    const w = baseWidth()*zoom, h = w*vp.height/vp.width;
    const d = document.createElement("div"); d.className = "pg"; d.style.width = w + "px"; d.style.height = h + "px"; d.dataset.i = i;
    d.innerHTML = '<span class="no">' + i + '</span>'; box.appendChild(d); pages.push({ d, pg, vp, done:false });
  }
  io.disconnect(); pages.forEach(p => io.observe(p.d));
}
async function draw(p){
  if (p.done) return; p.done = true;
  const w = parseFloat(p.d.style.width), dpr = Math.min(2, window.devicePixelRatio || 1), scale = w/p.vp.width*dpr;
  const vp = p.pg.getViewport({ scale }), c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  p.d.insertBefore(c, p.d.firstChild);
  await p.pg.render({ canvasContext:c.getContext("2d"), viewport:vp }).promise;
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ const p = pages[+e.target.dataset.i - 1]; draw(p); } }), { rootMargin:"800px 0px" });
const seen = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $("pinfo").textContent = "page " + e.target.dataset.i + " of " + doc.numPages; }), { threshold:0.4 });
async function relayout(){ await layout(); pages.forEach(p => seen.observe(p.d)); }
try {
  doc = await pdfjsLib.getDocument({ url:FILE }).promise; await relayout();
} catch (err) { console.error("viewer", err && (err.message || err)); $("msg").textContent = "This document couldn't be opened here. Use Save PDF, or return with Home."; }
$("zi").onclick = () => { zoom = Math.min(3, zoom*1.25); relayout(); };
$("zo").onclick = () => { zoom = Math.max(0.5, zoom/1.25); relayout(); };
$("top").onclick = () => scrollTo({ top:0, behavior:"smooth" });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(relayout, 250); });
</script>
</body>
</html>
